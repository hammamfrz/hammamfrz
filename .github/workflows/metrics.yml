name: Metrics

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

concurrency:
  group: metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Contribution stats (private contributions included as counts)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/stats.svg
          base: header, repositories
          config_timezone: Asia/Jakarta
          config_octicon: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
