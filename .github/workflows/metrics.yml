name: Metrics

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - .github/scripts/stats-card.sh

concurrency:
  group: metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render stats card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: .github/scripts/stats-card.sh

      - name: Commit the card if it changed
        run: |
          git add metrics/stats.svg
          if git diff --cached --quiet; then
            echo "Stats unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update stats card"
          git push
