<svg xmlns="http://www.w3.org/2000/svg" width="340" height="220" viewBox="0 0 340 220" role="img" aria-label="GitHub stats for hammamfrz">
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f6feb; font: 600 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: 400 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .value { fill: #1f2328; font: 600 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: end; font-variant-numeric: tabular-nums; }
    .note { fill: #8c959f; font: 400 11px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .title { fill: #58a6ff; }
      .label { fill: #8b949e; }
      .value { fill: #e6edf3; }
      .note { fill: #6e7681; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="339" height="219" rx="8"/>
  <text x="32" y="40" class="title">GitHub activity, last 12 months</text>
  <text x="32" y="76" class="label">Contributions</text><text x="300" y="76" class="value">1,542</text>
  <text x="32" y="104" class="label">Commits</text><text x="300" y="104" class="value">1,311</text>
  <text x="32" y="132" class="label">Pull requests opened</text><text x="300" y="132" class="value">160</text>
  <text x="32" y="160" class="label">Pull requests merged</text><text x="300" y="160" class="value">154</text>
  <text x="32" y="188" class="label">Pull requests reviewed</text><text x="300" y="188" class="value">23</text>
</svg>
